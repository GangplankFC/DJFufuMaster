apiVersion: apps/v1
kind: Deployment
metadata:
  name: yt-cipher
  labels:
    app: yt-cipher
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yt-cipher
  template:
    metadata:
      labels:
        app: yt-cipher
    spec:
      containers:
      - name: yt-cipher
        image: ghcr.io/kikkia/yt-cipher:master
        ports:
        - containerPort: 8001
        env:
        - name: API_TOKEN
          value: "yt-cipher-token"
        - name: IGNORE_SCRIPT_REGIONS
          value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: yt-cipher
spec:
  selector:
    app: yt-cipher
  ports:
  - protocol: TCP
    port: 8001
    targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pot-provider
  labels:
    app: pot-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pot-provider
  template:
    metadata:
      labels:
        app: pot-provider
    spec:
      containers:
      - name: pot-provider
        image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
        ports:
        - containerPort: 4416
---
apiVersion: v1
kind: Service
metadata:
  name: pot-provider
spec:
  selector:
    app: pot-provider
  ports:
  - protocol: TCP
    port: 4416
    targetPort: 4416
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pot-updater
  labels:
    app: pot-updater
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pot-updater
  template:
    metadata:
      labels:
        app: pot-updater
    spec:
      containers:
      - name: pot-updater
        image: alpine:3
        command: ["sh", "/updater.sh"]
        volumeMounts:
        - name: script-volume
          mountPath: /updater.sh
          subPath: updater.sh
          readOnly: true
      volumes:
      - name: script-volume
        configMap:
          name: pot-updater-script
