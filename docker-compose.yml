services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    environment:
      - API_TOKEN=yt-cipher-token
      - IGNORE_SCRIPT_REGIONS=true
    ports:
      - "8001:8001"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    network_mode: "host"
    container_name: lavalink_node
    restart: unless-stopped
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml
    environment:
      - _JAVA_OPTIONS=-Djava.net.preferIPv6Addresses=true -Djava.net.preferIPv4Stack=false
    depends_on:
      - yt-cipher

  player:
    build: .
    container_name: python_controller
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - lavalink

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: pot-provider
    restart: unless-stopped
    ports:
      - "4416:4416"

  pot-updater:
    image: alpine:3
    container_name: pot-updater
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - lavalink
      - pot-provider
    volumes:
      - ./scripts/updater.sh:/updater.sh:ro
    command: sh /updater.sh

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
