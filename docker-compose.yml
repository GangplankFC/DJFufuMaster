services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: yt-cipher
    environment:
      - API_TOKEN=yt-cipher-token
      - IGNORE_SCRIPT_REGIONS=true
    ports:
      - "8001:8001"

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink_node
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
    environment:
      - _JAVA_OPTIONS=-Djava.net.preferIPv4Stack=true -Djdk.http.auth.tunneling.disabledSchemes=""
    depends_on:
      - yt-cipher

  player:
    build: .
    container_name: python_controller
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./scripts/bot.py:/app/bot.py:ro 
    depends_on:
      - lavalink

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    container_name: pot-provider
    restart: unless-stopped
    ports:
      - "4416:4416"

  pot-updater:
    image: alpine:3
    container_name: pot-updater
    restart: unless-stopped
    depends_on:
      - lavalink
      - pot-provider
    volumes:
      - ./scripts/updater.sh:/updater.sh:ro
    command: sh /updater.sh

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
